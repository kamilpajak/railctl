# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the package and dev dependencies
        # --frozen refuses to re-resolve: if uv.lock is stale relative to
        # pyproject.toml, this step fails instead of silently installing a
        # resolution nobody committed and nobody can reproduce locally.
        run: uv sync --frozen

      - name: Assert no serial port is attached
        # The whole non-hardware suite must pass on a machine that has never seen
        # a YD7010. If a runner ever grew a serial device, a test could start
        # passing for the wrong reason and nothing would say so.
        run: |
          ! ls /dev/ttyUSB* /dev/ttyACM* 2>/dev/null

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        # The `ci` hypothesis profile in tests/conftest.py raises max_examples from
        # 100 to 500. It costs about 13 s locally and is the whole point of having
        # property tests run somewhere slower than a developer's patience.
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest

      - name: Exit-code canary
        # A second full run with every published exit code shifted by +100. It must
        # be GREEN: a test that goes red is one that asserts an exit code as a
        # NUMBER rather than by name, and its file and line are printed.
        #
        # It is here rather than left to a developer's habit because no regex can
        # do this job. A parametrize row like `[(0, 0, False), (1, 20, True)]` gives
        # nothing away about which number is a speed step and which is an exit code.
        # `tests/test_exit_code_literals.py` is the cheap half and runs in the step
        # above; this is the half that finds what the patterns cannot. The suite
        # takes about eleven seconds, so the whole cost is one more of those.
        #
        # HYPOTHESIS_PROFILE for the reason the Tests step gives: an unnamed job
        # runs the `default` profile with a value it never declared.
        env:
          HYPOTHESIS_PROFILE: ci
          RAILCTL_EXIT_CODE_CANARY: "1"
        run: uv run pytest

      - name: Coverage
        # Configured in pyproject.toml since M2 (fail_under = 90, branch = true,
        # serial_posix.py omitted) but only switched on here: at the end of M2 the
        # package was __init__.py plus errors.py, and a 90% gate over that measures
        # nothing. It stays out of addopts permanently, because mutation/*.toml run
        # the suite once per mutant.
        #
        # HYPOTHESIS_PROFILE is not optional here. Hypothesis turns derandomize on
        # by itself when it sees CI in the environment, so a job that names no
        # profile runs the `default` profile with a value `default` never declared,
        # and tests/unit/test_properties.py fails on the mismatch - which is what it
        # is there for. It also means an unnamed job would be the only run in CI
        # drawing random examples, so a newly discovered counterexample could fail
        # a build that changed nothing.
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest --cov --cov-report=term-missing

      - name: The M1 probe still imports
        # tools/ is deliberately outside the wheel. This is the only thing that
        # would notice if the pytest pythonpath entry that keeps it importable
        # were removed.
        run: uv run python -c "import tools.probe; print(tools.probe.__file__)"
