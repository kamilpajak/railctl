# Curated ZIMO MS/MX CV catalog. Transcribed from the C3 table of the approved
# design spec (docs/superpowers/specs/2026-08-03-railctl-design.md); the spec
# table is the source of every entry that carries no comment of its own, and an
# entry added since then names its source above it. A wrong description here is
# a documentation bug - correct it against the sheet that came with the decoder.
#
# Defaults when a key is absent: min = 0, max = 255, address = false,
# restorable = true, needs_speed_table = false.

